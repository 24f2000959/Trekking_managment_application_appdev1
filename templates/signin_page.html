<!DOCTYPE html>
<html lang="en">
<head>
    <title>Signin form </title>
    <link rel="stylesheet" href="/static/stylesheets/signin_page.css">

    <!-- adding bootstrap -->    
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  
        <!-- adding icons boostrap -->
            <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>
<body>
    <div id="main">
        <div id="canvas">
                <!-- creating naive bar -->
                <div id="header">
                    <div id="navebar">
                        <div class="logo" >
                            <div class="logotext">
                                <h1>
                                    Wheels tracking
                                </h1>
                            </div>
                        </div>
                        <div class="a" style="background: #1E3A34;">
                            <a href="/signin_page" class="signin">signin</a>
                            <a href="/login_page" class="login">login</a>
                            <a href="/" class="login"><i class="bi bi-house"></i></a>

                        </div>
                    </div>
                </div>

                <!-- content -->
                 <div id="content">
                    <h1 style="text-align: center;font-size: 60px;">
                        Signin 
                    </h1>
                    <div class="flash" style="text-align: center; background-color: rgb(247, 247, 7); color:black;">
                        {% for msg in get_flashed_messages() %}
                            {{ msg }}
                        {% endfor %}
                    </div>
                    <form action="/signin_page" method="POST">
                        <div class="mb-3">
                            <label for="name" class="form-label">Name</label>
                            <input type="text" class="form-control" id="emailid" name="name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email ID</label>
                            <input type="text" class="form-control" id="password" placeholder="xyz@gmail.com" name="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" id="password" name="pwd">
                        </div>
                        <div class="mb-3">
                            <label for="c_password" class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" id="c_password" name="cpwd">
                        </div>
                        <div>
                            <label for="user" style="font-size: 20px;">User</label>
                            <input type="radio" name="role" style="font-size: 70px;" id="user" value="user" checked>
            
                            <label for="staff" style="font-size: 20px; margin-left: 10%;">Staff</label>
                            <input type="radio" name="role" style="font-size: 70px;" id="staff" value="staff" checked>
                        </div>
                        
                        <div class="btn">
                            <button type="submit">Signin</button>
                        </div>
                        <div style="text-align: center;  font-size: 20px;">
                            have an account ? 
                            <a href="/login_page" style="text-decoration: none;">Login</a>

                        </div>
                        
                    </form>
                 </div>
                
                
        </div>
    </div>
</body>
</html>
