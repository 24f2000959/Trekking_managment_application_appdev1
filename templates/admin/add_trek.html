<!DOCTYPE html>
<html lang="en">
<head>
    <title>admin dashboard</title>
    <link rel="stylesheet" href="/static/stylesheets/admin/trek_form_page.css">

    <!-- adding bootstrap -->    
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- adding main bootstrap -->
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >


</head>
<body>
    <div id="main">
        <div id="container">
            <!-- -------------------------------------------------top part ------------------------------------------ -->
            <div id="top_part">
                <h1>Dashboard</h1>
                <div class="btn">
                    <i class="bi bi-three-dots"></i>
                </div>
            </div>
            <!-- ------------------------------------------------content------------------------------------ -->
            <div id="content">
                <div style="background-color: rgb(216, 216, 17);text-align: center;">
                    {% for msg in get_flashed_messages() %}
                        {{ msg }}
                    {% endfor %}
                </div>
                <form class="row g-3" action="/admin/add_trek" method="POST">
                    <div class="col-md-6">
                        <label for="trek" class="form-label">Trek Name</label>
                        <input type="text" class="form-control" id="trek" name="trek_name">
                    </div>
                    <div class="col-md-2">
                        <label for="end_date" class="form-label">Total slots</label>
                        <input type="number" class="form-control" id="end_date" name="total_slots">
                    </div>
                    
                    <div class="col-12">
                        <label for="inputAddress" class="form-label">Location</label>
                        <input type="text" class="form-control" id="inputAddress" placeholder="1234 Main St" name="location">
                    </div>
                    
                    <div class="col-md-4">
                        <label for="inputState" class="form-label">Difficulty</label>
                        <select id="inputState" class="form-select" name="difficulty">
                            <option>hard</option>
                            <option>easy</option>
                            <option>moderate</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label for="inputState" class="form-label">Status</label>
                        <select id="inputState" class="form-select" name="status">
                            <option>Open</option>
                        </select>
                        
                    </div>
                    <div class="col-md-4">
                        <label for="inputState" class="form-label">select Staff</label>
                        <select id="inputState" class="form-select" name="staff_id">
                            {% for s in staffs %}
                            <option value="{{ s.id }}">{{ s.user_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" class="form-control" id="start_date" name="start_date">
                    </div>
                    <div class="col-md-2">
                        <label for="end_date" class="form-label">duration</label>
                        <input type="number" class="form-control" id="end_date" name="duration">
                    </div>
                    
                    <label for="description">Description</label>
                    <textarea id="description" rows="5" cols="40" placeholder="Enter description here..." name="description"></textarea>
                                        
                    <div class="col-12" style="margin-left: 90%;">
                        <button type="submit" class="btn btn-primary">Create Trek</button>
                    </div>
                    
                </form>
                <div class="col-12" style="margin-left: 45%;">
                    <a href="/admin/admin_dashboard" class="btn btn-primary" style="width: 10%;"> back </a>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
