<!DOCTYPE html>
<html lang="en">
<head>
    <title>user dashboard</title>
    <link rel="stylesheet" href="/static/stylesheets/staff/trek_edit.css">

    <!-- adding bootstrap -->    
        <!-- Bootstrap Icons -->
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <!-- adding main bootstrap -->
         <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >


</head>
<body>
    <div id="main">
        <div id="container">
            <!-- -------------------------------------------------top part ------------------------------------------ -->
            <div id="top_part">
                <h1>Dashboard</h1>
                <div>
                    <h1>...</h1>
                </div>
            </div>
            <!-- ------------------------------------------------content------------------------------------ -->
            <div id="content">
                <div style="background-color: rgb(206, 206, 13);text-align: center;">
                    {% for msg in get_flashed_messages() %}
                        {{msg}}
                    {% endfor %}
                </div>
                {% for t in trek %}
                <form class="row g-3" action="/staff/trek_edit/{{t.id}}" method="POST"> 
                    <div class="col-md-4">
                        <label for="inputState" class="form-label">Status</label>
                        <select id="inputState" class="form-select" name="status">
                            <option>open</option>
                            <option>close</option>
                            <option>complete</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="inputState" class="form-label">available Slots</label>
                        <input type="number" id="inputState" class="form-control" name="available_slots" value="{{t.available_slot}}">
                    </div>    
                                        
                    <div class="col-12" style="margin-left: 45%;">
                        <button type="submit" class="btn btn-primary" style="width: 10%;"> Update </button>
                    </div>
                </form>
                {% endfor %}

                <div class="col-12" style="margin-left: 45%;">
                    <a href="/user/user_dashboard" class="btn btn-primary" style="width: 10%;"> back </a>
                </div>
            </div>
            
        </div>
    </div>
</body>
</html>
