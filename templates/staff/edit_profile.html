<!DOCTYPE html>
<html lang="en">
<head>
    <title>user dashboard</title>

    <link rel="stylesheet" href="/static/stylesheets/staff/dashboard_profile_page.css">

    <!-- adding bootstrap -->    
            <!-- adding icons boostrap -->
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
                
            <!-- adding container bootstrap -->
             <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
            

</head>
<body>
    <div id="main">
        
        <div id="container">
            <!-- --------------------------------------------left part---------------------------------------------------------- -->
            <div id="left_part">
                <div class="logo">
                    <i class="bi bi-file-person"></i>
                    <h1>User</h1>
                </div>
                <div class="line">
                    -
                </div>
                <div class="content">
                    <div class="options">
                        <a href="/staff/staff_dashboard">Dashboard</a>
                        <a href="/staff/my_treks_page">Treks</a>
                        <a href="/staff/staff_profile_page" class="active-menu">Profile</a>
                    </div>
                    <div class="logout">
                        <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout </a>
                    </div>
                </div>
            </div>

            <!-- --------------------------------------------right part ----------------------------------------------------- -->
            <div id="right_part">
                 <!-- -------------------------top part ---------------------------------- -->
                <div id="top_part">
                    <h1>
                        Dashboard
                    </h1>
                    <div class="icons">
                        <h1>...</h1>
                    </div>
                </div>
                <!-- ---------------------------content------------------------------------- -->
                <div id="content" style="padding-left: 5%;padding-top: 5% ;">
                    <div id="flash-card" style="background-color: rgb(238, 238, 10); text-align: center;">
                        {% for msg in get_flashed_messages() %}
                            {{msg}}
                        {% endfor %}
                    </div>
                    <form action="/staff/staff_edit_profile/{{this_user.id}}" method="POST">
                        <div class="form-group row">
                            <label for="inputPassword" class="col-sm-2 col-form-label">Name :</label>
                            <div class="col-sm-10">
                                <input readonly class="form-control" id="inputPassword" value="{{this_user.user_name}}">
                            </div>
                            <p style="color: grey;font-style: italic;">* cannot change username</p>
                        </div>
                        <div class="form-group row">
                            <label for="inputPassword" class="col-sm-2 col-form-label">Email :</label>
                            <div class="col-sm-10">
                                <input readonly class="form-control" id="inputPassword" value="{{this_user.email}}">
                            </div>
                            <p style="color: grey;font-style: italic;">* cannot change email</p>
                        </div>
                        <div class="form-group row">
                            <label for="inputPassword" class="col-sm-2 col-form-label">Password :</label>
                            <div class="col-sm-10">
                                <input type="password" class="form-control" id="inputPassword" name="password" value="{{this_user.password}}">
                            </div>
                        </div>
                        <button type="submit"
                                style="margin: 10% 32%; padding: 5px 100px" 
                                class="btn btn-primary">Submit</button>
                    </form>

                    
                </div>
                <!-- --------------------footer------------------------ -->
                <div id="footer">
                     Wheels Treckking Trekker Panel • v1.0
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
