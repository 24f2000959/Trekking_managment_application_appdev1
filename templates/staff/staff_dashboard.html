<!DOCTYPE html>
<html lang="en">
<head>
    <title>staff dashboard</title>

    <link rel="stylesheet" href="/static/stylesheets/staff/staff_dashboard.css">

    <!-- adding bootstrap -->    
            <!-- adding icons boostrap -->
                <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
                
            <!-- adding container bootstrap -->
             <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" >
            

</head>
<body>
    <div id="main">
        
        <div id="container">
            <!-- --------------------------------------------left part---------------------------------------------------------- -->
            <div id="left_part">
                <div class="logo">
                    <i class="bi bi-file-person"></i>
                    <h1>Staff</h1>
                </div>
                <div class="line">
                    -
                </div>
                <div class="content">
                    <div class="options">
                        <a href="/staff/staff_dashboard" class="active-menu">Dashboard</a>
                        <a href="/staff/my_treks_page">Assigned Treks</a>
                        <a href="/staff/staff_profile_page">Profile </a>
                    </div>
                    <div class="logout">
                        <a href="/logout"><i class="bi bi-box-arrow-right"></i> Logout </a>
                    </div>
                </div>
            </div>

            <!-- --------------------------------------------right part ----------------------------------------------------- -->
            <div id="right_part">
                 <!-- -------------------------top part ---------------------------------- -->
                <div id="top_part">
                    <h1>
                        Dashboard
                    </h1>
                    <div >
                        <h1>...</h1>
                    </div>
                </div>
                <!-- ---------------------------content------------------------------------- -->
                <div id="content">
                    <!-- ------card section_1 -->
                    <div class="card_section_1">
                        <div class="c_1" style="padding-left: 20px; padding-top: 20px;">
                                <h3 style="color: grey;">Welcome back</h3>
                                <h1>{{this_user.user_name}}</h1>
                                <p style="color: grey;">{{this_user.date}}</p>
                        </div>
                        <div class="c_2" style="padding-left: 20px; padding-top: 20px;">
                                <h1 style="margin-left: 40px;color: grey;">Assigned Treks</h1>
                                <h1 style="margin-left: 120px;">{{trek}}</h1>
                        </div>
                        <div class="c_3" style="padding-left: 20px; padding-top: 20px;">
                                <h1 style="margin-left: 60px; color: grey;">Trekkers</h1>
                                <h1 style="margin-left: 80px;">{{total_participants}}</h1>
                        </div>
                    </div>
                    <!-- -------car_Section_2-- -->
                     <div class="card_section_2">
                        <div class="c_1">
                            <img src="/static/images/staff_bar_1.png" >
                        </div>
                     </div>
                </div>
                <!-- --------------------footer------------------------ -->
                <div id="footer">
                     Wheels Treckking Trekker Panel • v1.0
                </div>
            </div>
        </div>
        
    </div>
</body>
</html>
